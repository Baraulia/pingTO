name: Release load agent

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  loadtest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Build binaries and catalog
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          LOADTEST_VERSION: ${{ github.ref_name }}
          RELEASE_BASE: ${{ github.server_url }}/${{ github.repository }}/releases/download/${{ github.ref_name }}
        run: |
          VER="${LOADTEST_VERSION#v}"
          export LOADTEST_VERSION="$VER"
          npm run build:loadtest
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            dist/loadtest/pingto-loadtest-windows-amd64.exe \
            dist/loadtest/pingto-loadtest-windows-arm64.exe \
            dist/loadtest/pingto-loadtest-macos-amd64 \
            dist/loadtest/pingto-loadtest-macos-arm64 \
            dist/loadtest/pingto-loadtest-linux-amd64 \
            dist/loadtest/pingto-loadtest-linux-arm64 \
            dist/loadtest/latest.json \
            --generate-notes
