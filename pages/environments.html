<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Environments Manager</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0D1117;
      color: #E5E7EB;
      padding: 20px;
      min-height: 100vh;
    }
    .container { max-width: 800px; margin: 0 auto; }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      padding-bottom: 16px;
      border-bottom: 1px solid #374151;
    }
    .header h1 { color: #3B82F6; font-size: 24px; }
    .header-actions { display: flex; gap: 10px; }
    .btn {
      padding: 8px 16px;
      border: none;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .btn-primary {
      background: #3B82F6;
      color: white;
    }
    .btn-primary:hover { background: #2563EB; }
    .btn-secondary {
      background: #1F2937;
      color: #E5E7EB;
      border: 1px solid #374151;
    }
    .btn-secondary:hover { background: #374151; }
    .btn-danger {
      background: #EF4444;
      color: white;
    }
    .btn-danger:hover { background: #DC2626; }
    .btn-success {
      background: #22C55E;
      color: white;
    }
    .btn-success:hover { background: #16A34A; }
    .btn-sm { padding: 4px 10px; font-size: 12px; }

    .env-list { display: flex; flex-direction: column; gap: 12px; }
    .env-card {
      background: #1F2937;
      border: 1px solid #374151;
      border-radius: 10px;
      padding: 16px;
      transition: all 0.2s;
    }
    .env-card:hover { border-color: #3B82F6; }
    .env-card .env-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }
    .env-card .env-name {
      font-size: 16px;
      font-weight: 600;
    }
    .env-card .env-actions {
      display: flex;
      gap: 4px;
    }
    .env-card .env-vars {
      margin-top: 8px;
    }
    .env-card .var-row {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 6px 8px;
      background: #0D1117;
      border-radius: 4px;
      margin-bottom: 4px;
      font-size: 13px;
    }
    .env-card .var-row .var-key {
      font-weight: 500;
      color: #3B82F6;
      min-width: 80px;
    }
    .env-card .var-row .var-value {
      color: #9CA3AF;
      flex: 1;
    }
    .env-card .var-row .var-actions {
      display: flex;
      gap: 4px;
    }
    .env-card .empty-state {
      color: #6B7280;
      font-size: 13px;
      text-align: center;
      padding: 12px 0;
    }
    .env-card .active-badge {
      background: #22C55E20;
      color: #22C55E;
      padding: 2px 10px;
      border-radius: 12px;
      font-size: 11px;
      font-weight: 500;
    }

    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0,0,0,0.7);
      z-index: 1000;
      justify-content: center;
      align-items: center;
    }
    .modal.active { display: flex; }
    .modal-content {
      background: #1F2937;
      border-radius: 12px;
      padding: 24px;
      max-width: 500px;
      width: 90%;
      border: 1px solid #374151;
    }
    .modal-content h2 {
      margin-bottom: 16px;
      color: #E5E7EB;
    }
    .modal-content input {
      width: 100%;
      padding: 10px;
      border: 1px solid #374151;
      border-radius: 6px;
      background: #0D1117;
      color: #E5E7EB;
      font-size: 14px;
      margin-bottom: 8px;
    }
    .modal-content input:focus {
      outline: none;
      border-color: #3B82F6;
    }
    .modal-content .var-group {
      display: flex;
      gap: 8px;
      margin-bottom: 8px;
      align-items: center;
    }
    .modal-content .var-group input { margin-bottom: 0; flex: 1; }
    .modal-actions {
      display: flex;
      gap: 10px;
      justify-content: flex-end;
      margin-top: 16px;
    }
    .add-var-btn {
      margin-bottom: 8px;
    }
    .toast {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 13px;
      z-index: 9999;
      background: #22C55E;
      color: white;
      animation: fadeIn 0.3s ease;
    }
    .toast.error { background: #EF4444; }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateX(-50%) translateY(20px); }
      to { opacity: 1; transform: translateX(-50%) translateY(0); }
    }
    @media (max-width: 600px) {
      .header { flex-direction: column; gap: 12px; align-items: stretch; }
      .header-actions { flex-wrap: wrap; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>🌍 Environments</h1>
      <div class="header-actions">
        <button class="btn btn-primary" id="newEnvBtn">+ New Environment</button>
        <button class="btn btn-secondary" id="backBtn">← Back</button>
      </div>
    </div>

    <div class="env-list" id="envList"></div>
  </div>

  <!-- Modal -->
  <div class="modal" id="envModal">
    <div class="modal-content">
      <h2 id="modalTitle">New Environment</h2>
      <input type="text" id="envName" placeholder="Environment name (e.g., Production)">
      <div id="varsContainer">
        <div class="var-group">
          <input type="text" placeholder="Variable key" class="var-key-input">
          <input type="text" placeholder="Variable value" class="var-value-input">
          <button class="btn btn-danger btn-sm remove-var-btn">×</button>
        </div>
      </div>
      <button class="btn btn-secondary btn-sm add-var-btn">+ Add variable</button>
      <div class="modal-actions">
        <button class="btn btn-primary" id="saveEnvBtn">Save</button>
        <button class="btn btn-secondary" id="cancelModalBtn">Cancel</button>
      </div>
    </div>
  </div>

  <script>
    let environments = [];
    let editingEnvId = null;

    const envList = document.getElementById('envList');
    const modal = document.getElementById('envModal');
    const modalTitle = document.getElementById('modalTitle');
    const envName = document.getElementById('envName');
    const varsContainer = document.getElementById('varsContainer');
    const saveEnvBtn = document.getElementById('saveEnvBtn');
    const cancelModalBtn = document.getElementById('cancelModalBtn');
    const newEnvBtn = document.getElementById('newEnvBtn');
    const backBtn = document.getElementById('backBtn');
    const addVarBtn = document.querySelector('.add-var-btn');

    function showToast(message, type = 'success') {
      const toast = document.createElement('div');
      toast.className = `toast ${type}`;
      toast.textContent = message;
      document.body.appendChild(toast);
      setTimeout(() => toast.remove(), 3000);
    }

    function esc(value) {
      return String(value ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    async function loadEnvironments() {
      return new Promise((resolve) => {
        chrome.storage.local.get(['api_environments'], (result) => {
          environments = result.api_environments || [];
          resolve(environments);
        });
      });
    }

    async function saveEnvironments() {
      return new Promise((resolve) => {
        chrome.storage.local.set({ api_environments: environments }, resolve);
      });
    }

    function getVarsFromModal() {
      const vars = {};
      const groups = varsContainer.querySelectorAll('.var-group');
      groups.forEach(group => {
        const keyInput = group.querySelector('.var-key-input');
        const valueInput = group.querySelector('.var-value-input');
        if (keyInput && valueInput && keyInput.value.trim()) {
          vars[keyInput.value.trim()] = valueInput.value.trim();
        }
      });
      return vars;
    }

    function renderEnvironments() {
      if (environments.length === 0) {
        envList.innerHTML = `
          <div style="text-align:center;padding:60px 20px;color:#6B7280;">
            <div style="font-size:48px;margin-bottom:16px;">🌍</div>
            <div style="font-size:16px;margin-bottom:8px;">No environments yet</div>
            <div style="font-size:14px;">Click "New Environment" to create one</div>
          </div>
        `;
        return;
      }

      envList.innerHTML = environments.map(env => `
        <div class="env-card" data-id="${esc(env.id)}">
          <div class="env-header">
            <span class="env-name">${esc(env.name)}</span>
            <div>
              <span class="active-badge" id="activeBadge_${esc(env.id)}">${env.active ? 'Active' : ''}</span>
              <button class="btn btn-success btn-sm activate-env" data-id="${esc(env.id)}">Activate</button>
              <button class="btn btn-secondary btn-sm edit-env" data-id="${esc(env.id)}">Edit</button>
              <button class="btn btn-danger btn-sm delete-env" data-id="${esc(env.id)}">Delete</button>
            </div>
          </div>
          <div class="env-vars">
            ${Object.keys(env.variables || {}).length > 0 ? 
              Object.entries(env.variables).map(([key, value]) => `
                <div class="var-row">
                  <span class="var-key">{{${esc(key)}}}</span>
                  <span class="var-value">${esc(value)}</span>
                </div>
              `).join('') :
              '<div class="empty-state">No variables</div>'
            }
          </div>
        </div>
      `).join('');

      // Activate
      document.querySelectorAll('.activate-env').forEach(btn => {
        btn.addEventListener('click', async (e) => {
          e.stopPropagation();
          const id = parseInt(btn.dataset.id);
          // Деактивируем все
          environments.forEach(e => e.active = false);
          const env = environments.find(e => e.id === id);
          if (env) {
            env.active = true;
            await saveEnvironments();
            renderEnvironments();
            showToast(`Environment "${env.name}" activated`);
            
            // Отправляем в popup
            chrome.storage.local.set({ active_environment_id: env.id }, () => {
              chrome.runtime.sendMessage({
                type: 'activateEnvironment',
                data: env
              });
            });
          }
        });
      });

      // Delete
      document.querySelectorAll('.delete-env').forEach(btn => {
        btn.addEventListener('click', async (e) => {
          e.stopPropagation();
          const id = parseInt(btn.dataset.id);
          if (confirm('Delete this environment?')) {
            environments = environments.filter(e => e.id !== id);
            await saveEnvironments();
            renderEnvironments();
            showToast('Environment deleted');
          }
        });
      });

      // Edit
      document.querySelectorAll('.edit-env').forEach(btn => {
        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          const id = parseInt(btn.dataset.id);
          const env = environments.find(e => e.id === id);
          if (env) {
            editingEnvId = id;
            modalTitle.textContent = 'Edit Environment';
            envName.value = env.name;
            varsContainer.innerHTML = '';
            Object.entries(env.variables || {}).forEach(([key, value]) => {
              addVarGroup(key, value);
            });
            if (Object.keys(env.variables || {}).length === 0) {
              addDefaultVarGroup();
            }
            modal.classList.add('active');
          }
        });
      });
    }

    function addVarGroup(key = '', value = '') {
      const div = document.createElement('div');
      div.className = 'var-group';
      const keyInput = document.createElement('input');
      keyInput.type = 'text';
      keyInput.placeholder = 'Variable key';
      keyInput.className = 'var-key-input';
      keyInput.value = key;
      const valueInput = document.createElement('input');
      valueInput.type = 'text';
      valueInput.placeholder = 'Variable value';
      valueInput.className = 'var-value-input';
      valueInput.value = value;
      const removeBtn = document.createElement('button');
      removeBtn.className = 'btn btn-danger btn-sm remove-var-btn';
      removeBtn.textContent = '×';
      div.append(keyInput, valueInput, removeBtn);
      varsContainer.appendChild(div);
    }

    function addDefaultVarGroup() {
      addVarGroup();
    }

    // Добавление переменной
    addVarBtn.addEventListener('click', addDefaultVarGroup);

    // Удаление переменной (делегирование)
    varsContainer.addEventListener('click', (e) => {
      if (e.target.classList.contains('remove-var-btn')) {
        const group = e.target.closest('.var-group');
        if (varsContainer.querySelectorAll('.var-group').length > 1) {
          group.remove();
        } else {
          showToast('At least one variable is required', 'error');
        }
      }
    });

    // Новая среда
    newEnvBtn.addEventListener('click', () => {
      editingEnvId = null;
      modalTitle.textContent = 'New Environment';
      envName.value = '';
      varsContainer.innerHTML = '';
      addDefaultVarGroup();
      modal.classList.add('active');
    });

    // Сохранение
    saveEnvBtn.addEventListener('click', async () => {
      const name = envName.value.trim();
      if (!name) {
        showToast('Enter environment name', 'error');
        return;
      }

      const variables = {};
      const groups = varsContainer.querySelectorAll('.var-group');
      groups.forEach(group => {
        const keyInput = group.querySelector('.var-key-input');
        const valueInput = group.querySelector('.var-value-input');
        if (keyInput && valueInput && keyInput.value.trim()) {
          variables[keyInput.value.trim()] = valueInput.value.trim();
        }
      });

      if (editingEnvId) {
        const env = environments.find(e => e.id === editingEnvId);
        if (env) {
          env.name = name;
          env.variables = variables;
        }
      } else {
        environments.push({
          id: Date.now(),
          name,
          variables,
          active: false,
          created: new Date().toISOString()
        });
      }

      await saveEnvironments();
      renderEnvironments();
      modal.classList.remove('active');
      showToast(editingEnvId ? 'Environment updated' : 'Environment created');
      editingEnvId = null;
    });

    cancelModalBtn.addEventListener('click', () => {
      modal.classList.remove('active');
      editingEnvId = null;
    });

    modal.addEventListener('click', (e) => {
      if (e.target === modal) {
        modal.classList.remove('active');
        editingEnvId = null;
      }
    });

    backBtn.addEventListener('click', () => {
      window.close();
    });

    // Инициализация
    async function init() {
      await loadEnvironments();
      renderEnvironments();

      // Проверяем активную среду
      const active = environments.find(e => e.active);
      if (active) {
        // Отправляем в popup
        chrome.runtime.sendMessage({
          type: 'activateEnvironment',
          data: active
        });
      }
    }

    init();

    // Слушаем сообщения из popup
    chrome.runtime.onMessage.addListener((message, sender, sendResponse) => {
      if (message.type === 'refreshEnvironments') {
        loadEnvironments().then(() => renderEnvironments());
      }
    });
  </script>
</body>
</html>
